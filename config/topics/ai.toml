# Change this one value to reuse the agent for another topic.
topic = "artificial intelligence"

# These defaults can stay unchanged for a first version.
article_count = 3
lookback_hours = 30
language = "en-US"
region = "US"

# Optional: timezone for the time shown in the email, e.g. "America/Phoenix".
# Leave blank to use the computer's local time.
timezone = ""

# How many collected articles OpenAI chooses from (5-100).
max_candidates = 25

# Skip articles whose title or snippet mentions any of these words.
exclude_keywords = []

[email]
subject_prefix = "Daily Research Digest"
recipients = ["recipient@example.com"]

[schedule]
frequency = "daily"
time = "10:00"

[sources.google_news]
enabled = true

# Optional: read recent Gmail newsletters through IMAP and rank their article
# links alongside Google News candidates. Uses GMAIL_USERNAME/GMAIL_PASSWORD
# from .env, or falls back to SMTP_USERNAME/SMTP_PASSWORD.
[sources.gmail]
enabled = false
mode = "senders" # senders, labels, or senders_and_labels
senders = []
labels = []
max_messages = 25
max_links_per_message = 6

# Optional: add any RSS or Atom feeds (blogs, publications, arXiv, etc.).
[sources.rss]
enabled = false
feeds = []
max_items_per_feed = 10

# Remember which articles were emailed so later digests do not repeat them.
[history]
enabled = true
days = 7
